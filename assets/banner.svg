<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Zero521 — Reverse Engineer</title>
  <desc id="desc">Dark terminal banner with an orange accent, animated signal, and blinking cursor. Reverse engineering, binary analysis, and low-level development.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101820" />
      <stop offset="1" stop-color="#0B0F14" />
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#FF9457" stop-opacity=".12" />
      <stop offset="1" stop-color="#FF9457" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#93A4B5" stroke-opacity=".06" />
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="998" height="358" rx="20" /></clipPath>
    <style>
      text { font-family: 'DejaVu Sans Mono', Consolas, monospace; }
      .cursor { animation: blink 1.2s step-end infinite; }
      .signal { stroke-dasharray: 420; stroke-dashoffset: 0; animation: trace 6s ease-in-out infinite; }
      .status { animation: pulse 3s ease-in-out infinite; }
      @keyframes blink { 0%, 45%, 100% { opacity: 1; } 50%, 95% { opacity: 0; } }
      @keyframes trace { 0%, 100% { stroke-dashoffset: 0; opacity: .9; } 50% { stroke-dashoffset: 420; opacity: .25; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .signal, .status { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#bounds)">
    <path fill="url(#background)" d="M0 0h1000v360H0z" />
    <path fill="url(#grid)" d="M0 0h1000v360H0z" />
    <ellipse cx="834" cy="170" rx="310" ry="260" fill="url(#glow)" />
    <path d="M0 51H1000" stroke="#25303B" />
    <circle cx="29" cy="26" r="4" fill="#FF9457" />
    <circle cx="45" cy="26" r="4" fill="#485360" />
    <circle cx="61" cy="26" r="4" fill="#485360" />
    <text x="91" y="31" font-size="12" fill="#9DAAB8">zero521 / workspace</text>
    <text x="968" y="31" text-anchor="end" font-size="11" fill="#9DAAB8">~/reverse</text>
    <text x="48" y="101" font-size="13" fill="#FFAA78" letter-spacing="2">BEHIND THE BINARY</text>
    <text x="45" y="178" font-size="68" font-weight="700" fill="#F0F4F8" letter-spacing="-3">Zero521<tspan class="cursor" fill="#FF9457">_</tspan></text>
    <text x="48" y="219" font-size="19" fill="#BDC8D3">Reverse Engineer</text>
    <text x="48" y="256" font-size="13" fill="#9DAAB8">Binary analysis. Debugging. Low-level development.</text>
    <g transform="translate(746 95)">
      <rect width="204" height="157" rx="12" fill="#111820" stroke="#34404C" />
      <text x="17" y="27" font-size="10" fill="#9DAAB8" letter-spacing="1">SIGNAL / 0x021</text>
      <path d="M17 86H187M17 57H187M17 115H187" stroke="#25303B" stroke-dasharray="3 5" />
      <path d="M17 86H39L49 74L61 97L77 47L94 119L110 71L121 86H145L155 64L166 86H187" stroke="#FF9457" stroke-width="2" stroke-linejoin="round" fill="none" opacity=".18" />
      <path class="signal" d="M17 86H39L49 74L61 97L77 47L94 119L110 71L121 86H145L155 64L166 86H187" stroke="#FFAA78" stroke-width="2" stroke-linejoin="round" fill="none" />
      <circle class="status" cx="20" cy="139" r="3" fill="#FFAA78" />
      <text x="31" y="143" font-size="10" fill="#9DAAB8">READ · TRACE · UNDERSTAND</text>
    </g>
    <path d="M48 291H952" stroke="#25303B" />
    <text x="48" y="326" font-size="12" fill="#BDC8D3">C <tspan fill="#586878">/</tspan> C++ <tspan fill="#586878">/</tspan> C# <tspan fill="#586878">/</tspan> Python <tspan fill="#586878">/</tspan> Java</text>
    <text x="952" y="326" text-anchor="end" font-size="11" fill="#FFAA78">github.com/Zero521 ↗</text>
  </g>
  <rect x=".5" y=".5" width="999" height="359" rx="20" fill="none" stroke="#34404C" />
</svg>
